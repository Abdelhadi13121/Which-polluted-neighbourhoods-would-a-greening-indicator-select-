name: Verify replication archive
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checksums and metadata
        run: python scripts/verify_package.py
      - name: Check Python syntax
        run: python -m compileall -q src scripts reproduce.py
      - name: Restore and verify exact data
        run: python reproduce.py --data-only
